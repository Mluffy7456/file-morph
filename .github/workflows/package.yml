name: Windows Package

on:
  push:
    branches: ["feat/architecture-foundation"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish portable app
        run: dotnet publish src/FileMorph.App/FileMorph.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/portable

      - name: Bundle Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $roots = @(
            "$env:ProgramFiles\Microsoft Visual Studio\2022",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022"
          ) | Where-Object { Test-Path $_ }
          $crt = Get-ChildItem -Path $roots -Filter Microsoft.VC143.CRT -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\Redist\\MSVC\\[^\\]+\\x64\\Microsoft\.VC143\.CRT$" } |
            Select-Object -First 1
          if (-not $crt) {
            throw "Microsoft Visual C++ 2015-2022 x64 runtime redist was not found on the runner."
          }
          Copy-Item "$($crt.FullName)\*" artifacts/portable/ -Force
          $required = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($name in $required) {
            if (-not (Test-Path "artifacts/portable/$name")) {
              throw "Missing app-local VC runtime file: $name"
            }
          }

      - name: Smoke test portable executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/portable/FileMorph.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) {
            throw "FileMorph exited during startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build installer
        run: iscc installer/FileMorph.iss

      - name: Assemble test ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          Copy-Item artifacts/portable artifacts/package/portable -Recurse
          Copy-Item artifacts/installer/FileMorph-Setup.exe artifacts/package/
          @'
          FileMorph Alpha test build
          
          Portable:
          Open the portable folder and run FileMorph.exe.
          
          Installer:
          Run FileMorph-Setup.exe.
          
          This is an early alpha. Only PNG, JPEG, BMP, TIFF and GIF conversion is implemented.
          Windows x64 required. Self-contained package; .NET runtime is included.
          '@ | Set-Content artifacts/package/README.txt -Encoding utf8
          Compress-Archive -Path artifacts/package/* -DestinationPath artifacts/FileMorph-Alpha-win-x64.zip -Force

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: FileMorph-Alpha-win-x64
          path: artifacts/FileMorph-Alpha-win-x64.zip
          if-no-files-found: error
          retention-days: 30
